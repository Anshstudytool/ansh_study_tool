<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANSH.STUDY MASTER PRO - Modern NDA AI Hub</title>
  <!-- Optional jsPDF CDN (Offline fallback uses native browser Print-to-PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #050816;
      --bg-glow-1: rgba(99, 102, 241, 0.22);
      --bg-glow-2: rgba(6, 182, 212, 0.16);
      --card: rgba(15, 23, 42, 0.72);
      --card-solid: #0f172a;
      --card-alt: rgba(30, 41, 59, 0.78);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --indigo: #6366f1;
      --accent: #10b981;
      --purple: #a855f7;
      --orange: #f59e0b;
      --danger: #f43f5e;
      --border: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(56, 189, 248, 0.35);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      --app-font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body.theme-forest {
      --bg: #041510;
      --bg-glow-1: rgba(16, 185, 129, 0.24);
      --bg-glow-2: rgba(52, 211, 153, 0.14);
      --card: rgba(6, 32, 24, 0.78);
      --card-solid: #062018;
      --card-alt: rgba(12, 50, 38, 0.8);
      --primary: #34d399;
      --accent: #10b981;
    }
    body.theme-sunset {
      --bg: #180b08;
      --bg-glow-1: rgba(245, 158, 11, 0.24);
      --bg-glow-2: rgba(244, 63, 94, 0.18);
      --card: rgba(36, 16, 14, 0.78);
      --card-solid: #24100e;
      --card-alt: rgba(58, 26, 22, 0.8);
      --primary: #fbbf24;
      --accent: #f97316;
    }
    body.theme-ocean {
      --bg: #04121f;
      --bg-glow-1: rgba(6, 182, 212, 0.25);
      --bg-glow-2: rgba(59, 130, 246, 0.18);
      --card: rgba(8, 28, 46, 0.78);
      --card-solid: #081c2e;
      --card-alt: rgba(14, 46, 72, 0.8);
      --primary: #22d3ee;
      --accent: #38bdf8;
    }
    body.theme-royal {
      --bg: #11071f;
      --bg-glow-1: rgba(168, 85, 247, 0.26);
      --bg-glow-2: rgba(236, 72, 153, 0.16);
      --card: rgba(28, 13, 48, 0.78);
      --card-solid: #1c0d30;
      --card-alt: rgba(45, 22, 76, 0.8);
      --primary: #c084fc;
      --accent: #e879f9;
    }
    body.theme-tactical {
      --bg: #0d120a;
      --bg-glow-1: rgba(132, 204, 22, 0.2);
      --bg-glow-2: rgba(234, 179, 8, 0.14);
      --card: rgba(22, 28, 18, 0.82);
      --card-solid: #161c12;
      --card-alt: rgba(36, 46, 28, 0.82);
      --primary: #a3e635;
      --accent: #84cc16;
    }
    body.full-expand .container {
      max-width: 100% !important;
      padding: 12px 18px;
    }
    body.full-expand .bottom-bar {
      max-width: calc(100% - 20px);
    }
    body.light {
      --bg: #eef2f9;
      --bg-glow-1: rgba(99, 102, 241, 0.12);
      --bg-glow-2: rgba(6, 182, 212, 0.12);
      --card: rgba(255, 255, 255, 0.85);
      --card-solid: #ffffff;
      --card-alt: rgba(226, 232, 240, 0.75);
      --text: #0f172a;
      --muted: #475569;
      --primary: #0284c7;
      --border: rgba(15, 23, 42, 0.1);
      --border-glow: rgba(2, 132, 199, 0.35);
      --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--app-font);
    }
    body {
      font-size: 16px;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 10%, var(--bg-glow-1), transparent 42%),
        radial-gradient(circle at 85% 25%, var(--bg-glow-2), transparent 45%);
      background-attachment: fixed;
      color: var(--text);
      padding-bottom: 96px;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Top App Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .logo span.brand-accent {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pro-tag {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      color: #ffffff;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }
    .top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-btn {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip-btn:hover { border-color: var(--primary); transform: translateY(-1px); }
    .chip-btn.active-chip {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Toast Notification */
    #toastContainer {
      position: fixed;
      top: 68px;
      right: 16px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
      pointer-events: none;
    }
    .toast {
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      animation: fadeToast 0.2s ease;
    }
    .toast.success { border-left-color: var(--accent); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warn { border-left-color: var(--orange); }
    @keyframes fadeToast {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* In-Page Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(6px);
      z-index: 2500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--card-solid);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: slideUp 0.2s ease;
    }

    /* Main Container */
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    .view-section { display: none; animation: slideUp 0.24s ease; }
    .view-section.active { display: block; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glassmorphic Cards */
    .card {
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .hero-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.18));
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-box.s-green { border-top-color: var(--accent); }
    .stat-box.s-purple { border-top-color: var(--purple); }
    .stat-box.s-orange { border-top-color: var(--orange); }
    .stat-num { font-size: 27px; font-weight: 900; color: var(--primary); }
    .stat-label { font-size: 13.5px; color: var(--muted); margin-top: 2px; font-weight: 600; }

    /* Buttons & Inputs */
    .btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28); }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6366f1); box-shadow: 0 4px 14px rgba(139, 92, 246, 0.28); }
    .btn-orange { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #ffffff; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28); }
    .btn-danger { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 4px 14px rgba(244, 63, 94, 0.28); }
    .btn-outline { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    .btn-sm { width: auto; padding: 9px 15px; font-size: 13.5px; border-radius: 10px; }

    .input-box, textarea.input-box, select.input-box {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-alt);
      color: var(--text);
      font-size: 15.5px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: var(--primary); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* Badges */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56,189,248,0.16);
      color: var(--primary);
      border: 1px solid rgba(56,189,248,0.35);
    }
    .badge-pyq {
      background: rgba(245,158,11,0.18);
      color: var(--orange);
      border-color: rgba(245,158,11,0.35);
    }
    .badge-inf {
      background: rgba(16,185,129,0.18);
      color: var(--accent);
      border-color: rgba(16,185,129,0.35);
    }
    .badge-purple {
      background: rgba(168,85,247,0.18);
      color: var(--purple);
      border-color: rgba(168,85,247,0.35);
    }
    .badge-danger {
      background: rgba(244,63,94,0.18);
      color: var(--danger);
      border-color: rgba(244,63,94,0.35);
    }

    /* Smart Book Styles */
    .sb-subject-boxes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (min-width: 650px) {
      .sb-subject-boxes { grid-template-columns: repeat(3, 1fr); }
    }
    .sb-sub-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .sb-sub-box:hover { border-color: var(--primary); transform: translateY(-1px); }
    .sb-sub-box.active-box {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35);
    }
    .sb-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    @media (min-width: 650px) {
      .sb-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .sb-chapter-card {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .sb-chapter-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .sb-chapter-card.is-read {
      border-left: 4px solid var(--accent);
    }
    .sb-section-box {
      background: rgba(2, 6, 23, 0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 14px;
    }
    body.light .sb-section-box {
      background: rgba(241, 245, 249, 0.85);
    }
    .sb-section-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sb-theory-text {
      font-size: 15.5px;
      line-height: 1.75;
      white-space: pre-line;
      color: var(--text);
    }
    .sb-formula-item {
      background: var(--card-alt);
      border-left: 3px solid var(--purple);
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14.5px;
      line-height: 1.6;
      font-family: 'Segoe UI', monospace, sans-serif;
    }
    .sb-qa-card {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .sb-qa-q {
      font-size: 15px;
      font-weight: 700;
      color: var(--orange);
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .sb-qa-a {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-line;
    }

    /* Flashcard Box */
    .flashcard-face {
      background: var(--card-alt);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px 18px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      margin: 12px 0;
      transition: transform 0.2s ease;
    }
    .flashcard-face:hover { transform: translateY(-2px); }

    /* AI Master Chat */
    .chat-box {
      height: 360px;
      overflow-y: auto;
      background: rgba(2, 6, 23, 0.45);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    body.light .chat-box { background: rgba(241, 245, 249, 0.75); }
    .msg {
      max-width: 88%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.bot {
      background: var(--card-alt);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border-left: 4px solid var(--primary);
    }
    .msg.user {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg code {
      background: rgba(0,0,0,0.28);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12.5px;
    }

    /* Mock Test Options */
    .mcq-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mcq-option:hover { border-color: var(--primary); }
    .mcq-option.selected {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--primary);
      font-weight: 700;
    }
    .mcq-option.opt-correct {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--accent);
      color: #34d399;
      font-weight: 700;
    }
    .mcq-option.opt-wrong {
      background: rgba(244, 63, 94, 0.22);
      border-color: var(--danger);
      color: #fb7185;
    }

    /* Question Palette Pills */
    .q-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .q-pill {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-alt);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .q-pill.answered { background: rgba(16,185,129,0.25); border-color: var(--accent); color: var(--accent); }
    .q-pill.current { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56,189,248,0.35); }

    /* PDF & Todo Items */
    .pdf-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-alt);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }
    .pdf-info h4 { font-size: 16px; margin-bottom: 4px; }
    .pdf-info p { font-size: 13.5px; color: var(--muted); }
    .todo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-alt);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 15px;
      gap: 10px;
    }
    .todo-item.done span { text-decoration: line-through; color: var(--muted); }
    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* Alarm Banner */
    #alarmBanner {
      display: none;
      background: linear-gradient(90deg, var(--danger), var(--orange));
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      gap: 10px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    /* Floating Glass Bottom Bar (7 Tabs) */
    .bottom-bar {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      max-width: 940px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px 4px;
      z-index: 999;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 2px;
      border-radius: 10px;
      transition: 0.2s;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-btn .icon { font-size: 19px; }
    .tab-btn.active {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
    }

    @media (max-width: 480px) {
      .bottom-bar { padding: 6px 2px; width: calc(100% - 10px); }
      .tab-btn { font-size: 9.5px; gap: 2px; padding: 4px 1px; }
      .tab-btn .icon { font-size: 16px; }
    }

    /* Native Offline Print-to-PDF Area (Supports Hindi + Unicode Math 100%) */
    #printableSheet { display: none; }
    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }

    .metrics-strip {
      display: grid;

    .mission-card {
      background: var(--card);

      align-items: center;

      padding: 4px 0;

    }

    .prog-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
      flex: 1;
    }
    .prog-fill-gold {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b, #fde047);
      transition: width 0.3s ease;
    }
    .prog-fill-purple {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #c084fc);
      transition: width 0.3s ease;
    }

    /* Continue Learning Card */
    .continue-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.85), rgba(15, 23, 42, 0.85));

    .book-3d-badge {

    .quick-tile {

<body>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- In-Page Confirmation Modal -->
  <div id="confirmModal" class="modal-backdrop">
    <div class="modal-box" style="max-width:400px; text-align:center;">
      <h3 id="confirmModalTitle" style="font-size:18px; margin-bottom:8px;">Confirm Action</h3>
      <p id="confirmModalMsg" style="font-size:14px; color:var(--muted); margin-bottom:18px; line-height:1.5;"></p>
      <div class="row">
        <button class="btn btn-outline" style="flex:1;" onclick="closeConfirmModal(false)">Cancel</button>
        <button class="btn btn-primary" id="confirmModalOkBtn" style="flex:1;" onclick="closeConfirmModal(true)">Yes, Proceed</button>
      </div>
    </div>
  </div>

  <!-- Mistake Notebook & Spaced Revision Modal -->
  <div id="mistakeModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="row" style="justify-content:space-between; margin-bottom:12px;">
        <h3 style="font-size:18px;">📓 Adaptive Mistake Notebook</h3>
        <button class="chip-btn" onclick="closeMistakeModal()">✕ Close</button>
      </div>
      <p id="mistakeModalMeta" style="font-size:12.5px; color:var(--muted); margin-bottom:12px;"></p>
      <div id="mistakeModalBody"></div>
    </div>
  </div>

  <!-- Formula Flashcards Modal -->
  <div id="flashcardModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <h3 style="font-size:18px;">🃏 Smart Book Formula Flashcards</h3>
        <button class="chip-btn" onclick="closeFlashcardModal()">✕ Close</button>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <select id="fcSubjectFilter" class="input-box" style="flex:1; margin-bottom:0;" onchange="buildFlashcardDeck()">
          <option value="all">📚 All Subjects (PCM)</option>
          <option value="Maths">📐 Mathematics</option>
          <option value="Physics">⚡ Physics</option>
          <option value="Chemistry">🧪 Chemistry</option>
        </select>
        <button class="chip-btn" onclick="shuffleFlashcards()">🔀 Shuffle</button>
      </div>
      <div id="fcCounter" style="font-size:12px; color:var(--muted); text-align:center;">Card 1 / 1</div>
      <div class="flashcard-face" onclick="flipFlashcard()">
        <span id="fcChapterBadge" class="badge badge-purple" style="margin-bottom:10px;">Subject</span>
        <div id="fcMainText" style="font-size:16px; font-weight:700; line-height:1.55;">Tap to reveal formula</div>
        <div id="fcHintText" style="font-size:12px; color:var(--muted); margin-top:10px;">👆 Tap card to flip</div>
      </div>
      <div class="row">
        <button class="btn btn-outline" style="flex:1;" onclick="stepFlashcard(-1)">⬅ Prev</button>
        <button class="btn btn-primary" style="flex:1;" onclick="flipFlashcard()">🔄 Flip</button>
        <button class="btn btn-green" style="flex:1;" onclick="stepFlashcard(1)">Next ➔</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Inputs -->
  <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="handleImportBackup(event)">
  <input type="file" id="importQPackInput" accept=".json" style="display:none;" onchange="handleImportQuestionPack(event)">

  <!-- Native Print-to-PDF Container -->
  <div id="printableSheet"></div>

  <!-- Top Navigation Bar -->

        <path d="M58 26C50 24 44 28 40 34C46 35 53 33 58 26Z" fill="#38BDF8" opacity="0.9"/>

        <polygon points="32,20 34.4,26 40.8,26.2 35.8,30 37.5,36 32,32.5 26.5,36 28.2,30 23.2,26.2 29.6,26" fill="#FBBF24"/>
        <defs>

          </linearGradient>

      </svg>
      <div>
        <div class="logo">ANSH.<span class="brand-accent">STUDY</span></div>
        <div class="brand-sub">Dream &diams; Prepare &diams; Achieve</div>
      </div>
