<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maths Books Hub — Google Connect, Formulas, 99 Theory & 88 Examples</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f9;
      color: #1f2937;
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    h1, h2, h3, h4 {
      margin-top: 0;
      color: #111827;
    }
    .google-box, .controls, .tabs, .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    button, .btn-link {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn-link:hover {
      background: #1d4ed8;
    }
    button.secondary {
      background: #475569;
    }
    button.secondary:hover {
      background: #334155;
    }
    button.active {
      background: #0f766e;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .btn-google {
      background: #059669;
    }
    .btn-google:hover {
      background: #047857;
    }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #f8fafc;
    }
    .theory-item {
      border-left: 4px solid #2563eb;
      padding: 10px 14px;
      margin-bottom: 10px;
      background: #f8fafc;
      border-radius: 0 8px 8px 0;
    }
    code {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 14px;
      color: #0f172a;
    }
    .meta {
      font-size: 13px;
      color: #475569;
      margin-bottom: 10px;
    }
    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 22px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Books Hub &amp; Maths Study Module</h1>
    <p class="meta">Google Books live search + Direct Google Search + Detailed Formulas + 99 Theory Points + 88 Solved Examples</p>

    <!-- 1. Google Connect Section -->
    <div class="google-box">
      <input
        type="text"
        id="bookQueryInput"
        value="Quadratic Equations Mathematics"
        placeholder="Book ya Maths topic likhein (e.g. RD Sharma Quadratic Equations, Calculus)..."
      />
      <button onclick="searchGoogleBooks()">Search on Google Books</button>
      <a
        id="directGoogleSearchLink"
        class="btn-link btn-google"
        href="https://www.google.com/search?q=Quadratic+Equations+Mathematics+book+notes"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read / Search on Google
      </a>
    </div>
    <div id="googleBooksResults"></div>

    <hr />

    <!-- 2. Chapter Section -->
    <h2 id="chapterTitle"></h2>

    <div class="tabs">
      <button id="tab-formulas" class="active" onclick="selectTab('formulas')">Formulas (Detail)</button>
      <button id="tab-theory" onclick="selectTab('theory')">Theory (99)</button>
      <button id="tab-examples" onclick="selectTab('examples')">Examples (88)</button>
    </div>

    <div class="controls">
      <input
        type="text"
        id="searchFilterInput"
        oninput="onFilterChange()"
        placeholder="Filter karein: keyword ya ID likhein (e.g. discriminant, T5, E12)..."
      />
      <button class="secondary" onclick="resetFilter()">Clear</button>
    </div>

    <div id="statusSummary" class="meta"></div>
    <div id="contentArea"></div>
    <div id="paginationArea" class="pagination"></div>
  </div>

  <script>
    const chapterData = {
      title: "Mathematics — Chapter: Quadratic Equations",
      formulas: [
        {
          id: "F1",
          name: "Standard Quadratic Equation",
          formula: "ax^2 + bx + c = 0   (a ≠ 0)",
          variables: "x = variable, a = coefficient of x^2, b = coefficient of x, c = constant term",
          condition: "a ≠ 0 hona zaroori hai; agar a = 0 ho toh equation linear ban jayegi.",
          explanation: "Kisi bhi second-degree polynomial equation ko standard form mein likh kar a, b, c ki values nikali jaati hain."
        },
        {
          id: "F2",
          name: "Discriminant (Viviktikar — D)",
          formula: "D = b^2 - 4ac",
          variables: "a, b, c = standard form ke coefficients",
          condition: "Real roots ke liye D ≥ 0; equal roots ke liye D = 0; imaginary/complex roots ke liye D < 0.",
          explanation: "Roots ke nature (real, equal, ya complex) ka pata lagane ke liye sabse pehle D nikala jata hai."
        },
        {
          id: "F3",
          name: "Quadratic Formula (Shreedharacharya Formula)",
          formula: "x = (-b ± √(b^2 - 4ac)) / (2a) = (-b ± √D) / (2a)",
          variables: "x = roots of the equation, D = b^2 - 4ac",
          condition: "a ≠ 0 aur real values ke liye D ≥ 0.",
          explanation: "Jab middle-term splitting se factors aasani se na milein, tab is formula se direct dono roots milte hain."
        },
        {
          id: "F4",
          name: "Sum and Product of Roots (α, β)",
          formula: "α + β = -b / a   aur   αβ = c / a",
          variables: "α, β = equation ke do roots",
          condition: "a ≠ 0.",
          explanation: "Equation ko solve kiye bina hi roots ka sum aur product seedha coefficients se mil jata hai."
        },
        {
          id: "F5",
          name: "Difference of Roots",
          formula: "|α - β| = √D / |a|",
          variables: "α, β = roots, D = b^2 - 4ac",
          condition: "Real roots ke liye D ≥ 0 aur a ≠ 0.",
          explanation: "(α - β)^2 = (α + β)^2 - 4αβ = D / a^2 se square root lekar derived hota hai."
        },
        {
          id: "F6",
          name: "Quadratic Equation from Given Roots",
          formula: "x^2 - (α + β)x + αβ = 0",
          variables: "α, β = diye gaye roots",
          condition: "Kisi non-zero constant k se multiply karne par bhi same roots rehte hain: k[x^2 - (α + β)x + αβ] = 0.",
          explanation: "Agar do roots diye gaye hon toh pehle unka sum aur product nikal kar equation banayi ja sakti hai."
        },
        {
          id: "F7",
          name: "Condition for One Common Root",
          formula: "(c1a2 - c2a1)^2 = (b1c2 - b2c1)(a1b2 - a2b1)",
          variables: "a1, b1, c1 aur a2, b2, c2 = do equations ke coefficients",
          condition: "Dono equations a1x^2 + b1x + c1 = 0 aur a2x^2 + b2x + c2 = 0 ke paas kam se kam ek common root ho.",
          explanation: "Cramer's rule / cross-multiplication se common root α nikal kar relation banaya jata hai."
        },
        {
          id: "F8",
          name: "Condition for Both Roots Common",
          formula: "a1 / a2 = b1 / b2 = c1 / c2",
          variables: "a1, b1, c1 aur a2, b2, c2 = coefficients (denominator ≠ 0)",
          condition: "Dono equations identical (same ratio) honi chahiye.",
          explanation: "Jab dono equations ke dono roots same hon toh corresponding coefficients ka ratio equal hota hai."
        }
      ],
      theory: Array.from({ length: 99 }, (_, index) => {
        const num = index + 1;
        const baseNotes = [
          "Quadratic equation ki highest power (degree) hamesha 2 hoti hai.",
          "Agar x^2 ka coefficient (a) zero ho jaye toh equation quadratic nahi rehti, linear ban jati hai.",
          "Quadratic equation ke complex number system mein hamesha 2 roots (counted with multiplicity) hote hain.",
          "Discriminant D = b^2 - 4ac se roots ka nature determine hota hai.",
          "Agar D > 0 ho toh equation ke do distinct real roots milte hain.",
          "Agar D = 0 ho toh dono roots real aur equal hote hain, aur har root -b/(2a) ke barabar hota hai.",
          "Agar D < 0 ho toh real numbers mein koi root nahi hota; roots complex conjugate hote hain.",
          "Agar a, b, c rational hon aur D > 0 ek perfect square ho, toh roots rational numbers hote hain.",
          "Agar a, b, c rational hon aur D > 0 perfect square na ho, toh roots irrational conjugate pair (p + √q, p - √q) mein aate hain.",
          "Agar a, b, c real hon aur D < 0 ho, toh roots p + iq aur p - iq ke roop mein hote hain.",
          "Agar a + b + c = 0 ho, toh x = 1 hamesha ek root hota hai aur doosra root c/a hota hai.",
          "Agar a - b + c = 0 ho, toh x = -1 hamesha ek root hota hai aur doosra root -c/a hota hai."
        ];
        const note = baseNotes[index % baseNotes.length];
        return {
          id: `T${num}`,
          text: `${note} [Point #${num} — Quadratic Equations]`
        };
      }),
      examples: Array.from({ length: 88 }, (_, index) => {
        const num = index + 1;
        const a = (index % 3) + 1;
        const r1 = (index % 6) + 1;
        const r2 = r1 + 2;
        const sum = r1 + r2;
        const prod = r1 * r2;
        const bCoeff = -a * sum;
        const cCoeff = a * prod;
        const disc = (bCoeff * bCoeff) - (4 * a * cCoeff);
        return {
          id: `E${num}`,
          question: `Solve for x and find discriminant D: ${a}x^2 ${bCoeff >= 0 ? "+" : "-"} ${Math.abs(bCoeff)}x ${cCoeff >= 0 ? "+" : "-"} ${Math.abs(cCoeff)} = 0`,
          steps: `1) a = ${a}, b = ${bCoeff}, c = ${cCoeff}.  2) D = b^2 - 4ac = (${bCoeff})^2 - 4(${a})(${cCoeff}) = ${disc}.  3) Factoring gives (${a}x ... ) = 0 -> roots are x = ${r1} and x = ${r2}.`,
          answer: `x = ${r1}, ${r2}  (D = ${disc})`
        };
      })
    };

    let currentTab = "formulas";
    let currentPage = 1;
    const pageSize = 15;

    function selectTab(tabName) {
      currentTab = tabName;
      currentPage = 1;
      ["formulas", "theory", "examples"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle("active", t === tabName);
      });
      renderContent();
    }

    function onFilterChange() {
      currentPage = 1;
      renderContent();
    }

    function resetFilter() {
      document.getElementById("searchFilterInput").value = "";
      currentPage = 1;
      renderContent();
    }

    function changePage(newPage) {
      currentPage = newPage;
      renderContent();
      window.scrollTo({ top: 220, behavior: "smooth" });
    }

    function renderContent() {
      document.getElementById("chapterTitle").textContent = chapterData.title;
      const query = (document.getElementById("searchFilterInput").value || "").trim().toLowerCase();
      const statusEl = document.getElementById("statusSummary");
      const contentEl = document.getElementById("contentArea");
      const paginationEl = document.getElementById("paginationArea");

      if (currentTab === "formulas") {
        const filteredFormulas = chapterData.formulas.filter(f =>
          !query || `${f.id} ${f.name} ${f.formula} ${f.variables} ${f.condition} ${f.explanation}`.toLowerCase().includes(query)
        );
        statusEl.textContent = `Showing ${filteredFormulas.length} detailed formulas`;
        paginationEl.innerHTML = "";
        contentEl.innerHTML = filteredFormulas.length
          ? filteredFormulas.map(f => `
              <div class="card">
                <h4>${f.id}: ${f.name}</h4>
                <p><strong>Formula:</strong> <code>${f.formula}</code></p>
                <p><strong>Variables:</strong> ${f.variables}</p>
                <p><strong>Condition:</strong> ${f.condition}</p>
                <p><strong>Detail:</strong> ${f.explanation}</p>
              </div>
            `).join("")
          : "<p>Is filter ke liye koi formula nahi mila.</p>";
        return;
      }

      const sourceList = currentTab === "theory" ? chapterData.theory : chapterData.examples;
      const filteredItems = sourceList.filter(item => {
        const searchable = currentTab === "theory"
          ? `${item.id} ${item.text}`
          : `${item.id} ${item.question} ${item.steps} ${item.answer}`;
        return !query || searchable.toLowerCase().includes(query);
      });

      const totalPages = Math.max(1, Math.ceil(filteredItems.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      const startIdx = (currentPage - 1) * pageSize;
      const pageItems = filteredItems.slice(startIdx, startIdx + pageSize);

      statusEl.textContent = `Matched: ${filteredItems.length} items | Page ${currentPage} of ${totalPages}`;

      if (!pageItems.length) {
        contentEl.innerHTML = "<p>Koi matching item nahi mila.</p>";
        paginationEl.innerHTML = "";
        return;
      }

      if (currentTab === "theory") {
        contentEl.innerHTML = pageItems.map(t => `
          <div class="theory-item">
            <strong>${t.id}:</strong> ${t.text}
          </div>
        `).join("");
      } else {
        contentEl.innerHTML = pageItems.map(ex => `
          <div class="card">
            <h4>${ex.id}</h4>
            <p><strong>Question:</strong> ${ex.question}</p>
            <p><strong>Step-by-Step Solution:</strong> ${ex.steps}</p>
            <p><strong>Answer:</strong> <code>${ex.answer}</code></p>
          </div>
        `).join("");
      }

      paginationEl.innerHTML = `
        <button ${currentPage <= 1 ? "disabled" : ""} onclick="changePage(${currentPage - 1})">Previous</button>
        <span>Page ${currentPage} / ${totalPages}</span>
        <button ${currentPage >= totalPages ? "disabled" : ""} onclick="changePage(${currentPage + 1})">Next</button>
      `;
    }

    async function searchGoogleBooks() {
      const inputEl = document.getElementById("bookQueryInput");
      const resultsEl = document.getElementById("googleBooksResults");
      const googleLinkEl = document.getElementById("directGoogleSearchLink");
      const q = (inputEl.value || "").trim();

      if (!q) {
        resultsEl.innerHTML = "<p>Kripya koi book ya topic ka naam likhein.</p>";
        return;
      }

      googleLinkEl.href = `https://www.google.com/search?q=${encodeURIComponent(q + " book notes pdf")}`;
      resultsEl.innerHTML = "<p>Google Books par search kiya ja raha hai...</p>";

      try {
        const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=6`;
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          resultsEl.innerHTML = "<p>Google Books par koi result nahi mila. 'Read / Search on Google' button try karein.</p>";
          return;
        }

        resultsEl.innerHTML = data.items.map(item => {
          const info = item.volumeInfo || {};
          const title = info.title || "Untitled";
          const authors = Array.isArray(info.authors) ? info.authors.join(", ") : "Unknown Author";
          const desc = info.description
            ? `${info.description.slice(0, 200)}${info.description.length > 200 ? "..." : ""}`
            : "Preview description Google Books par dekhein.";
          const link = info.previewLink || info.infoLink || "#";

          return `
            <div class="card">
              <h4>${title}</h4>
              <p class="meta"><strong>Author(s):</strong> ${authors}</p>
              <p>${desc}</p>
              <a class="btn-link" href="${link}" target="_blank" rel="noopener noreferrer">Open / Preview Book on Google</a>
            </div>
          `;
        }).join("");
      } catch (err) {
        resultsEl.innerHTML = "<p>Live search fetch nahi ho paya; upar diye gaye 'Read / Search on Google' button par click karein.</p>";
      }
    }

    // Initial render
    renderContent();
  </script>
</body>
</html>
